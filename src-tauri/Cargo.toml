[package]
name = "memo"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enables macOS system-audio capture via ScreenCaptureKit (Swift/Metal link step).
system-audio-macos = ["dep:screencapturekit"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
hound = "3.5.1"
uuid = { version = "1.23.2", features = ["v4"] }
chrono = "0.4.45"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "7.0.1", features = ["macos_13_0"], optional = true }
